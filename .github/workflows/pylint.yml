name: Pylint

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements-train.txt
      - name: Run Pylint
        run: |
          pylint scripts/fly_chess_inference.py scripts/fly_chess_trainer.py scripts/gif_gen.py
      - name: Import inference app
        env:
          PYTHONPATH: scripts
        run: python -c "import fly_chess_inference"

  flygym:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements-flygym.txt
      - name: Run Pylint
        env:
          PYTHONPATH: scripts
        run: |
          pylint scripts/fly_chess_inference_flygym.py \
            --disable=global-statement,import-outside-toplevel,broad-exception-caught
      - name: Import FlyGym app
        env:
          PYTHONPATH: scripts
        run: python -c "import fly_chess_inference_flygym"
