name: Render FlyGym GIF

on:
  push:
    branches:
      - smoother-flygym-gif-readme
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2 libglvnd0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-flygym.txt
    - name: Render GIF
      run: python scripts/gif_gen_flygym.py
    - name: Upload GIF
      uses: actions/upload-artifact@v4
      with:
        name: chess-flygym-neurons
        path: chess_flygym_neurons.gif
        if-no-files-found: error
